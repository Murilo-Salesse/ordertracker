spring:
  application:
    name: ordertracker

  datasource:
    url: jdbc:sqlite:ordertracker.db?busy_timeout=5000
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

api:
  security:
    token:
      secret: ${JWT_SECRET:dev-only-fallback-secret-key-with-at-least-32-bytes}
      # (86400000ms = 24h)
      expiration: ${JWT_EXPIRATION:86400000}