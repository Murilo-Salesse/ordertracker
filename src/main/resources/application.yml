spring:
  application:
    name: ordertracker

  datasource:
    url: jdbc:sqlite:ordertracker.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    show-sql: true

api:
  security:
    token:
      secret: "foody-delivery-secret-key"
      # (86400000ms = 24h)
      expiration: 86400000